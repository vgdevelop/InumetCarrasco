[project]
name = "inumet-carrasco"
version = "1.0.0"
description = "Recolector de telemetría pública de INUMET para la estación Carrasco"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
    "pandas>=2.2,<4",
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
    "XlsxWriter>=3.2,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
